<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9333ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Fitness Coach — Personalized workouts, nutrition plans, and AI-powered meal suggestions." />
    <title>Fitness & Wellness | Interactive Preview</title>
  </head>
  <body data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" translate="no">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Legacy SW cached stale JS (e.g. old AdminPanel calling Cloud Functions). Clear and unregister.
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          });
        }
      })();
    </script>
  </body>
</html>
